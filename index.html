<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aayush Gund | Official Portfolio</title>
    <meta name="google-site-verification" content="zhjGHYb0U6bEm6o4CgAMYaDlxu9TZvdPmkHgjSoBgeY" />
    <style>
        body { 
            background-color: #050505; 
            color: #fff; 
            font-family: 'Poppins', sans-serif; 
            margin: 0; 
            padding: 0;
        }
        .bg-glow { 
            position: fixed; 
            top: 0; 
            width: 100%; 
            height: 100%; 
            background: radial-gradient(circle at 50% 20%, rgba(0, 255, 204, 0.15), transparent 70%);
            z-index: -1;
        }
        .hero { 
            min-height: 80vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            text-align: center; 
            padding: 20px; 
        }
        h1 { 
            font-size: 3.5rem; 
            margin: 0; 
            background: linear-gradient(90deg, #fff, #00ffcc); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .sub { 
            font-size: 1.1rem; 
            color: #888; 
            margin-top: 10px; 
        }
        
        /* Dynamic Rotating Text Styling */
        .typewriter-box {
            color: #00ffcc;
            font-weight: bold;
            font-size: 1.3rem;
            margin: 15px 0;
            min-height: 30px;
            display: inline-block;
            border-bottom: 2px solid #00ffcc;
            padding-bottom: 2px;
        }
        .cursor {
            display: inline-block;
            width: 3px;
            background-color: #00ffcc;
            margin-left: 3px;
            animation: blink 0.7s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .stats { display: flex; gap: 15px; margin-top: 25px; flex-wrap: wrap; justify-content: center; }
        .stat-card { background: rgba(255, 255, 255, 0.05); padding: 15px 25px; border-radius: 12px; border: 1px solid rgba(0, 255, 204, 0.2); }
        .btn-launch { padding: 18px 35px; background: #00ffcc; color: #000; text-decoration: none; font-weight: bold; border-radius: 50px; box-shadow: 0 0 20px rgba(0, 255, 204, 0.4); margin-top: 25px; display: inline-block; transition: 0.3s; }
        .btn-launch:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(0, 255, 204, 0.7); }
        .about-section { max-width: 800px; margin: 40px auto; padding: 20px; }
        .skill-tag { display: inline-block; background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 20px; font-size: 0.9rem; margin: 4px; border: 1px solid #333; }
        .gallery { padding: 40px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
        .screenshot { width: 100%; border-radius: 10px; border: 1px solid #222; }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="hero">
        <p class="sub">Independent Developer & Tech Creator</p>
        <h1>Aayush Gund</h1>
        
        <div class="typewriter-box">
            <span id="typewriter"></span><span class="cursor">&nbsp;</span>
        </div>

        <a href="https://aayushgund2-bit.github.io/10th-reality-check/" class="btn-launch">TRY 10TH REALITY CHECK 💀</a>
    </div>

    <script>
        const words = [
            "Student & Web Builder ⚡",
            "AI Explorer 🤖",
            "10th Passed 💀",
            "Full-Stack Learner 💻"
        ];
        
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const typewriterElement = document.getElementById("typewriter");

        function typeEffect() {
            const currentWord = words[wordIndex];
            
            if (isDeleting) {
                typewriterElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;
            } else {
                typewriterElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 40 : 80;

            if (!isDeleting && charIndex === currentWord.length) {
                typeSpeed = 1800; // Pause at full word
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                wordIndex = (wordIndex + 1) % words.length;
                typeSpeed = 400; // Pause before typing next word
            }

            setTimeout(typeEffect, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(typeEffect, 500);
        });
    </script>

</body>
</html>
